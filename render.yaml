services:
  - type: web
    name: astra-onshape-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip check && python -m unittest discover -s tests -v
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ONSHAPE_ACCESS_KEY
        sync: false
      - key: ONSHAPE_SECRET_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: ENABLE_CAD_WRITES
        value: "false"
      - key: BRIDGE_OFFLINE
        value: "true"
      - key: ENABLE_RAW_FEATURE_WRITES
        value: "false"
      - key: ONSHAPE_AUTH_MODE
        value: hmac
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: CHAT_BEARER_TOKEN
        generateValue: true
